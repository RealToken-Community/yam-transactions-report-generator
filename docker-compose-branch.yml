services:
  api:
    image: ${DOCKER_REGISTRY}/yam-report:api
    container_name: ${DOCKER_BRANCH}-yam_report_api
    environment:

      # App config
      REALTOKENS_API_URL: "${REALTOKENS_API_URL}"
      API_PORT_INTERNAL: "${API_PORT_INTERNAL}"
      CORS_ORIGIN_REGEX: "${CORS_ORIGIN_REGEX}"
      TELEGRAM_ALERT_BOT_TOKEN: "${TELEGRAM_ALERT_BOT_TOKEN}"
      TELEGRAM_ALERT_GROUP_ID: "${TELEGRAM_ALERT_GROUP_ID}"

      # Postgres
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_READER_USER_NAME: "${POSTGRES_READER_USER_NAME}"
      POSTGRES_READER_USER_PASSWORD: "${POSTGRES_READER_USER_PASSWORD}"

    networks:
      - yam-report
      - traefik-realt
      - yam-graph

    volumes:
      - yam-report-api-logs:/app/logs

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yam-report-api-${DOCKER_BRANCH}.rule=Host(`${HOSTNAME}`) && PathPrefix(`/api`)"
      - "traefik.http.services.yam-report-api-${DOCKER_BRANCH}.loadbalancer.server.port=5000"

    restart: unless-stopped

  ui:
    image: ${DOCKER_REGISTRY}/yam-report:ui
    container_name: ${DOCKER_BRANCH}-yam_report_ui
    networks:
      - yam-report
      - traefik-realt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yam-report-ui-${DOCKER_BRANCH}.rule=Host(`${HOSTNAME}`) && PathPrefix(`/`)"
      - "traefik.http.services.yam-report-ui-${DOCKER_BRANCH}.loadbalancer.server.port=80"
    restart: unless-stopped

volumes:
  yam-report-api-logs:

networks:
  yam-report:
  traefik-realt:
    external: true
  yam-graph:
    external: true
